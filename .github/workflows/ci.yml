name: Cross-platform tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Run OpenNest.Tests
        run: dotnet test OpenNest.Tests/OpenNest.Tests.csproj
      - name: Run OpenNest.Engine.Tests
        run: dotnet test OpenNest.Engine.Tests/OpenNest.Engine.Tests.csproj
      - name: Run OpenNest.IO.Tests
        run: dotnet test OpenNest.IO.Tests/OpenNest.IO.Tests.csproj
