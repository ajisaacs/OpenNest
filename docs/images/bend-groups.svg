<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" width="600" height="390" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Bend group letters by bend line direction against the sheet grain</title>
  <rect width="600" height="390" rx="12" fill="#ffffff"/>
  <text x="300" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b3350">Bend line direction against the grain</text>

  <!-- A and B tolerance wedges (within 5 degrees) -->
  <g fill="#1e8a4c" fill-opacity="0.15">
    <path d="M300,300 L317.4,100.8 A200,200 0 0,0 282.6,100.8 Z"/>
    <path d="M300,300 L500,300 A200,200 0 0,0 499.2,282.6 Z"/>
    <path d="M300,300 L100.8,282.6 A200,200 0 0,0 100,300 Z"/>
  </g>

  <!-- 15 degree steps -->
  <g stroke="#9aa3ad" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="300" y1="300" x2="493.2" y2="248.2"/>
    <line x1="300" y1="300" x2="473.2" y2="200"/>
    <line x1="300" y1="300" x2="441.4" y2="158.6"/>
    <line x1="300" y1="300" x2="400" y2="126.8"/>
    <line x1="300" y1="300" x2="351.8" y2="106.8"/>
    <line x1="300" y1="300" x2="248.2" y2="106.8"/>
    <line x1="300" y1="300" x2="200" y2="126.8"/>
    <line x1="300" y1="300" x2="158.6" y2="158.6"/>
    <line x1="300" y1="300" x2="126.8" y2="200"/>
    <line x1="300" y1="300" x2="106.8" y2="248.2"/>
  </g>

  <!-- With the grain (B) and across it (A) -->
  <g stroke="#1e8a4c" stroke-width="4">
    <line x1="100" y1="300" x2="500" y2="300"/>
    <line x1="300" y1="300" x2="300" y2="100"/>
  </g>

  <g font-size="11" fill="#6b7580" text-anchor="middle" dominant-baseline="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">
    <text x="454.5" y="258.6">15°</text>
    <text x="438.6" y="220">30°</text>
    <text x="413.1" y="186.9">45°</text>
    <text x="380" y="161.4">60°</text>
    <text x="341.4" y="145.5">75°</text>
    <text x="258.6" y="145.5">105°</text>
    <text x="220" y="161.4">120°</text>
    <text x="186.9" y="186.9">135°</text>
    <text x="161.4" y="220">150°</text>
    <text x="145.5" y="258.6">165°</text>
  </g>

  <g font-size="17" font-weight="bold" fill="#1b3350" text-anchor="middle" dominant-baseline="middle">
    <text x="517.3" y="241.8">C</text>
    <text x="494.9" y="187.5">D</text>
    <text x="459.1" y="140.9">E</text>
    <text x="412.5" y="105.1">F</text>
    <text x="358.2" y="82.7">G</text>
    <text x="241.8" y="82.7">H</text>
    <text x="187.5" y="105.1">I</text>
    <text x="140.9" y="140.9">J</text>
    <text x="105.1" y="187.5">K</text>
    <text x="82.7" y="241.8">L</text>
  </g>
  <g font-size="20" font-weight="bold" fill="#1e8a4c" text-anchor="middle" dominant-baseline="middle">
    <text x="300" y="72">A</text>
    <text x="525" y="300">B</text>
    <text x="75" y="300">B</text>
  </g>
  <g font-size="11" fill="#6b7580" dominant-baseline="middle">
    <text x="300" y="52" text-anchor="middle">across the grain, within 5°</text>
    <text x="490" y="316" text-anchor="end">with the grain, within 5°</text>
  </g>

  <!-- Grain direction -->
  <line x1="120" y1="345" x2="470" y2="345" stroke="#1b3350" stroke-width="2.5"/>
  <path d="M490,345 L468,336 L468,354 Z" fill="#1b3350"/>
  <text x="300" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b3350">GRAIN</text>
</svg>
